name: iOS IPA (imzasız)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Spotify iOS SDK'yı hazırla
        run: |
          for d in ${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/spotify_sdk_ios-*/ios; do
            echo "SDK: $d"
            (cd "$d" && sh ./prepare-iOS-SDK.sh)
            ls "$d/spotify_sdk_ios/ios-sdk"
          done

      - name: IPA oluştur (imzasız)
        run: |
          flutter build ios --release --no-codesign -v > build.log 2>&1 || (grep -n -i -B2 -A8 "error" build.log | tail -c 50000 > build-tail.log; tail -c 20000 build.log >> build-tail.log; exit 1)
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -qr CarPlay.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarPlay-ipa
          path: build/CarPlay.ipa

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarPlay (derleme ${{ github.run_number }})
          files: build/CarPlay.ipa

      - name: Hata günlüğünü yayınla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Derleme günlüğü ${{ github.run_number }}
          prerelease: true
          files: build-tail.log
